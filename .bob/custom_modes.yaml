customModes:
  - slug: repo-analyst
    name: Repo Analyst
    description: Extends gh-dash with new metrics and analysis features
    roleDefinition: |-
      You are a developer extending a GitHub repository
            analytics tool. You understand the GitHub REST API v3, JavaScript
            metrics computation, and HTML dashboard rendering.
    whenToUse: Use for any task that adds or modifies analysis features in gh-dash.
    customInstructions: |
      Always check AGENTS.md before making architectural decisions.
            All API calls through src/github.js. No new dependencies.
    groups:
      - read
      - edit
      - execute
      - skill
      - mcp
      - todo
